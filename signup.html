<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | Luxury Fashion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/SC-global-style.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth/signup.css" />
  </head>
  <body>
    <main>
      <section class="pf-signup">
        <div class="pf-container">
          <div class="pf-signup-content">
            <div class="pf-signup-head">
              <div class="pf-text-wrapper">
                <div class="pf-text-box">
                  <h1 class="pf-heading-font pf-signup-title">Sign up</h1>
                </div>
              </div>
            </div>
            <div class="pf-signup-body">
              <form class="pf-signup-form">
                <div class="pf-form-group">
                  <input placeholder="" type="text" required />
                  <label>Full Name</label>
                </div>
                <div class="pf-form-group">
                  <input placeholder="" type="tel" required />
                  <label>Phone</label>
                </div>
                <div class="pf-form-group">
                  <input placeholder="" type="email" required />
                  <label>Email</label>
                </div>
                <div class="pf-form-group pf-form-password">
                  <input placeholder="" type="password" required />
                  <label>Password</label>
                  <button type="button" class="pf-password-toggle">
                    <span>
                      <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M12 19.5C4.14879 19.5 0.256291 12.6555 0.0944788 12.3643C0.0325173 12.2529 0 12.1274 0 11.9999C0 11.8724 0.0325173 11.747 0.0944788 11.6355C0.256291 11.3445 4.14879 4.5 12 4.5C19.8512 4.5 23.7437 11.3445 23.9055 11.6357C23.9674 11.7471 24 11.8726 24 12.0001C24 12.1276 23.9674 12.253 23.9055 12.3645C23.7437 12.6555 19.8512 19.5 12 19.5ZM1.63254 11.9989C2.52467 13.3509 6.02735 18 12 18C17.9915 18 21.4787 13.3547 22.3674 12.0011C21.4753 10.6491 17.9726 6 12 6C6.00842 6 2.52129 10.6453 1.63254 11.9989ZM12 16.5C9.5186 16.5 7.49998 14.4814 7.49998 12C7.49998 9.51862 9.5186 7.5 12 7.5C14.4814 7.5 16.5 9.51862 16.5 12C16.5 14.4814 14.4814 16.5 12 16.5ZM12 9C10.3459 9 8.99998 10.3459 8.99998 12C8.99998 13.6541 10.3459 15 12 15C13.6541 15 15 13.6541 15 12C15 10.3459 13.6541 9 12 9Z"
                          fill="#737373"
                        />
                      </svg>
                    </span>
                  </button>
                </div>
                <div class="pf-form-group pf-form-password">
                  <input placeholder="" type="password" required />
                  <label>Confirm Password</label>
                  <button type="button" class="pf-password-toggle">
                    <span>
                      <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M12 19.5C4.14879 19.5 0.256291 12.6555 0.0944788 12.3643C0.0325173 12.2529 0 12.1274 0 11.9999C0 11.8724 0.0325173 11.747 0.0944788 11.6355C0.256291 11.3445 4.14879 4.5 12 4.5C19.8512 4.5 23.7437 11.3445 23.9055 11.6357C23.9674 11.7471 24 11.8726 24 12.0001C24 12.1276 23.9674 12.253 23.9055 12.3645C23.7437 12.6555 19.8512 19.5 12 19.5ZM1.63254 11.9989C2.52467 13.3509 6.02735 18 12 18C17.9915 18 21.4787 13.3547 22.3674 12.0011C21.4753 10.6491 17.9726 6 12 6C6.00842 6 2.52129 10.6453 1.63254 11.9989ZM12 16.5C9.5186 16.5 7.49998 14.4814 7.49998 12C7.49998 9.51862 9.5186 7.5 12 7.5C14.4814 7.5 16.5 9.51862 16.5 12C16.5 14.4814 14.4814 16.5 12 16.5ZM12 9C10.3459 9 8.99998 10.3459 8.99998 12C8.99998 13.6541 10.3459 15 12 15C13.6541 15 15 13.6541 15 12C15 10.3459 13.6541 9 12 9Z"
                          fill="#737373"
                        />
                      </svg>
                    </span>
                  </button>
                </div>
                <button type="submit" class="pf-form-submit">Sign Up</button>
              </form>
            </div>
            <div class="pf-signup-footer">
              <a href="./login.html">Sign In</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./js/SC-global-script.js"></script>
    <script src="./js/auth/signup.js"></script>
  </body>
</html>
